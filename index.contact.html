<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Swan MESGUEN</title>
  <link rel="stylesheet" href="styles.contact.css">
</head>
<body>

  <!-- En-tête -->
  <header class="header">
    <div class="header__inner">
      <h1 class="header__name">Contact</h1>
      <p class="header__subtitle">Discutons ensemble ! </p>
      <a href="indexversion3.html" style="display:inline-block; margin-top:10px;">← Retour à l'accueil</a>
    </div>
  </header>

  <!-- Section de contact -->
  <main>
    <section class="section">
      <div class="section__inner">
        <h2>Me contacter</h2>
        <p>Vous pouvez m’écrire en utilisant ce formulaire, mon adresse email ou via mon numéro de téléphone :</p>
        <p><a href="mailto:ton.email@example.com">swan.mesguen@gmail.com</a></p>
        <p><a href="telephone"> +33 07 68 42 10 12</a></p>

        <!-- Formulaire de contact -->
        <form action="#" method="post" class="contact-form">
          <div style="margin-bottom: 15px;">
            <label for="nom">Nom :</label><br>
            <input type="text" id="nom" name="nom" required style="width: 100%; padding: 10px;">
          </div>

          <div style="margin-bottom: 15px;">
            <label for="email">Email :</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 10px;">
          </div>

          <div style="margin-bottom: 15px;">
            <label for="message">Message :</label><br>
            <textarea id="message" name="message" rows="6" required style="width: 100%; padding: 10px;"></textarea>
          </div>

          <button type="submit" style="padding: 10px 20px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
            Envoyer
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__inner">
      <p>© 2025 Swan MESGUEN</p>
    </div>
  </footer>
